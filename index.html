<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سيفو فون | SIFOU PHONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#E3E8F1; --ink:#0E1B3D; --muted:#59657F; --line:#D2D9E7;
  --brand:#2340E8; --btn:#2340E8; --hero:#2340E8;
  --sticker:#FFC93C; --sticker-ink:#0E1B3D;
  --coral:#D93A25; --mint:#0C8A63; --amber:#A66A00; --violet:#7B3FC4;
  --ts:65%; --tl:90%;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  --f-head:"Noto Kufi Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1226; --surface:#131B36; --surface2:#1B2547; --ink:#EAF0FF; --muted:#9EABCB; --line:#27325C;
    --brand:#7C93FF; --btn:#3F5BFF; --hero:#182BAE;
    --coral:#FF7A66; --mint:#38D0A0; --amber:#F2B84F; --violet:#B591FF;
    --ts:38%; --tl:22%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1226; --surface:#131B36; --surface2:#1B2547; --ink:#EAF0FF; --muted:#9EABCB; --line:#27325C;
  --brand:#7C93FF; --btn:#3F5BFF; --hero:#182BAE;
  --coral:#FF7A66; --mint:#38D0A0; --amber:#F2B84F; --violet:#B591FF;
  --ts:38%; --tl:22%; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-head);line-height:1.4;margin:0;font-weight:800}
h2{font-size:1.25rem}
p{margin:.4rem 0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.hero :focus-visible{outline-color:#fff}
.wrap{width:min(1180px,100% - 2rem);margin-inline:auto}
.narrow{width:min(420px,100% - 2rem);margin:3rem auto}
.muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center} .grow{flex:1}
.spacer{flex:1}
[hidden]{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:12px;padding:.7rem 1.3rem;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.4;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--btn);color:#fff}
.btn-sticker{background:var(--sticker);color:var(--sticker-ink)}
.btn-ghost{background:transparent;border:1.5px solid var(--line)}
.btn-ghost-w{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.btn-danger{background:transparent;color:var(--coral);border:1.5px solid color-mix(in srgb,var(--coral) 45%,transparent)}
.btn-sm{padding:.3rem .8rem;font-size:.9rem;border-radius:9px}
.btn.block{width:100%;padding:.95rem;font-size:1.05rem;margin-top:1rem}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (background:color-mix(in srgb,red,blue)){.top{background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}}
.top-in{display:flex;align-items:center;gap:1rem;height:60px}
.brand{display:flex;align-items:center;gap:.65rem;font-family:var(--f-head);font-weight:800;font-size:1.1rem;text-decoration:none}
.logo{display:flex;flex:none;width:36px;height:36px;border-radius:11px;overflow:hidden}
.logo svg{display:block}
.brandtxt{display:flex;flex-direction:column;line-height:1.2}
.brandtxt i{font-style:normal;font-family:var(--f-body);font-weight:600;font-size:.6rem;letter-spacing:.14em;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:.4rem;border:1.5px solid var(--line);border-radius:99px;padding:.15rem .9rem;text-decoration:none;font-size:.92rem}

/* hero */
.hero{background:var(--hero);color:#fff;overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.1fr .9fr;gap:2rem;align-items:center;padding-block:3rem}
.hero h1{font-size:clamp(1.8rem,4.6vw,3rem);line-height:1.35;max-width:17em}
.hero p{font-size:1.1rem;opacity:.92;max-width:32em;margin-top:1rem}
.cta{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.5rem}
.hero-art{position:relative;justify-self:center;width:min(360px,78vw);aspect-ratio:1/1;display:grid;place-items:center}
.hero-art::before{content:"";position:absolute;inset:4%;border-radius:50%;background:rgba(255,255,255,.14)}
.hero-art>svg{position:relative;width:88%;height:88%}
.hero-art>img{position:relative;width:88%;height:88%;object-fit:cover;border-radius:28px}
.hero-art .sticker{position:absolute;left:-2%;bottom:6%;font-size:1.25rem;animation:stamp .55s cubic-bezier(.2,1.5,.4,1) .35s both}
@keyframes stamp{from{transform:rotate(-16deg) scale(1.9);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}

/* price sticker */
.sticker{display:inline-flex;flex-direction:column;align-items:center;background:var(--sticker);color:var(--sticker-ink);padding:.45rem 1rem .55rem;border-radius:10px;transform:rotate(-4deg);font-family:var(--f-head);font-weight:800;outline:2px dashed rgba(14,27,61,.5);outline-offset:-6px;line-height:1.25;box-shadow:0 3px 0 rgba(14,27,61,.25)}
.sticker .was{font-size:.72em;font-weight:600;opacity:.7;text-decoration:line-through}
.sticker .pv{display:flex;align-items:baseline;gap:.3em}
.sticker b{font-size:1.5em}
.sticker small{font-size:.75em}
.sticker.sm{font-size:.82rem}
.sticker.lg{font-size:1.3rem}

/* catalog */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:2rem 0 .75rem}
.search{display:flex;align-items:center;gap:.6rem;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 .9rem;margin-bottom:.5rem;max-width:460px}
.search input{border:0;background:transparent;padding:.65rem 0;flex:1;min-width:0;outline:0}
.search:focus-within{border-color:var(--brand)}
.bar{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem 0 1rem;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:.25rem 1rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem 1rem}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:1.75rem 1.25rem}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.empty{color:var(--muted);padding:2rem 0;grid-column:1/-1}
.tile{display:block;text-decoration:none;color:inherit}
.tile .art{position:relative;aspect-ratio:1/1;border-radius:16px;background:hsl(var(--h) var(--ts) var(--tl));display:grid;place-items:center;overflow:hidden}
.tile .art>svg{width:76%;height:76%;transition:transform .25s}
.tile .art>img{width:100%;height:100%;object-fit:cover}
.tile:hover .art>svg{transform:scale(1.05) rotate(-2deg)}
.tile .sticker{position:absolute;inset-inline-end:.5rem;bottom:.5rem}
.tile h3{font-size:.98rem;font-weight:600;margin:.65rem 0 0;font-family:var(--f-body)}
.tile .cat{color:var(--muted);font-size:.85rem}
.tile.out .art>svg,.tile.out .art>img{opacity:.45}
.off{position:absolute;inset-block-start:.5rem;inset-inline-start:.5rem;background:var(--coral);color:#fff;border-radius:8px;padding:0 .55rem;font-weight:700;font-size:.85rem}
.soldout{position:absolute;inset-inline-end:.5rem;bottom:.5rem;background:var(--ink);color:var(--bg);border-radius:8px;padding:.1rem .7rem;font-size:.85rem;font-weight:600}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem 2rem;margin-top:3.5rem;padding-block:2.25rem;border-block:1px solid var(--line)}
.trust>div{display:flex;gap:.9rem;align-items:flex-start}
.trust .ti{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--surface);color:var(--brand)}
.trust h3{font-size:1rem}
@media(max-width:720px){.hero-in{grid-template-columns:1fr;padding-block:2rem}.trust{grid-template-columns:1fr}}
.foot{padding:1.5rem 0 2.5rem;color:var(--muted);font-size:.92rem}
.foot-in{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between}

/* product page */
.crumbs{font-size:.9rem;color:var(--muted);padding:1rem 0}
.crumbs a{text-decoration:none}
.has-bar{padding-bottom:5.5rem}
.pdp{display:grid;gap:1.5rem 2.5rem;grid-template-columns:1fr;grid-template-areas:"gallery" "buy" "details" "faq"}
@media(min-width:900px){.pdp{grid-template-columns:1.1fr .9fr;grid-template-areas:"gallery buy" "details buy" "faq buy";grid-template-rows:auto auto 1fr;align-items:start}}
.gallery{grid-area:gallery}.buy{grid-area:buy}.details{grid-area:details}.faq{grid-area:faq}
.stage{position:relative;aspect-ratio:1/1;border-radius:20px;background:hsl(var(--h) var(--ts) var(--tl));display:grid;place-items:center;overflow:hidden}
.stage>svg{width:80%;height:80%}
.stage>img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:.6rem;margin-top:.7rem}
.thumb{width:64px;height:64px;border-radius:10px;border:2px solid transparent;padding:0;cursor:pointer;overflow:hidden;background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb[aria-current="true"]{border-color:var(--brand)}
.buy{background:var(--surface);border-radius:20px;padding:1.25rem}
.buy h1{font-size:1.5rem}
.price-row{display:flex;align-items:center;flex-wrap:wrap;gap:1rem;margin:1rem 0 .5rem}
.saving{color:var(--mint);font-weight:600}
.note{color:var(--amber);font-weight:600;margin:.25rem 0}
.note.bad{color:var(--coral)}
.fs{border:0;padding:0;margin:1rem 0 0;min-width:0}
.fs legend{font-weight:600;font-size:.92rem;padding:0;margin-bottom:.35rem}
.opts,.choice{display:flex;flex-wrap:wrap;gap:.5rem}
.choice{display:grid;grid-template-columns:1fr 1fr}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:block;border:1.5px solid var(--line);border-radius:10px;padding:.35rem .95rem;background:var(--bg)}
.opt small{display:block;color:var(--muted);font-size:.82rem}
.opt input:checked+span{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.opt input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.f{display:grid;gap:.25rem;margin-top:.9rem}
.f>label,.f>.lb{font-weight:600;font-size:.92rem}
.f input,.f select,.f textarea,.sel{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:.6rem .8rem;outline:0}
.f input:focus,.f select:focus,.f textarea:focus,.sel:focus{border-color:var(--brand)}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--coral)}
.err{color:var(--coral);font-size:.85rem;min-height:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
@media(max-width:520px){.row3{grid-template-columns:1fr}}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);width:max-content}
.qty button{width:42px;height:42px;border:0;background:transparent;font-size:1.2rem;cursor:pointer}
.qty output{min-width:2.5rem;text-align:center;font-weight:700}
.sum{margin-top:1.1rem;padding-top:.8rem;border-top:1px dashed var(--line)}
.sum>div{display:flex;justify-content:space-between;gap:1rem;padding:.1rem 0}
.sum .total{font-family:var(--f-head);font-size:1.15rem;font-weight:800;margin-top:.3rem}
.details h2,.faq h2{margin:1.25rem 0 .5rem}
.feat{margin:0;padding:0;list-style:none;display:grid;gap:.5rem}
.feat li{display:flex;gap:.6rem;align-items:flex-start}
.feat li::before{content:"";flex:none;width:9px;height:9px;margin-top:.6rem;border-radius:3px;background:var(--sticker);transform:rotate(45deg)}
.desc{max-width:60ch;color:var(--muted)}
details{border-top:1px solid var(--line);padding:.75rem 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:600}
details p{color:var(--muted);margin-top:.4rem}
.stickybar{position:fixed;inset-inline:0;bottom:0;z-index:15;display:flex;align-items:center;gap:1rem;background:var(--surface);border-top:1px solid var(--line);padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){.stickybar{display:none}.has-bar{padding-bottom:2rem}}
.done{text-align:center;padding:1rem .25rem}
.tick{display:grid;place-items:center;width:64px;height:64px;margin:0 auto .75rem;border-radius:50%;background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}
.done .btn{margin-top:.75rem}

/* dialogs & toast */
.scrim{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,14,34,.6);padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(1rem + env(safe-area-inset-bottom,0px));animation:fade .15s}
.dialog{background:var(--surface);border-radius:20px;width:min(680px,100%);max-height:100%;overflow:auto;padding:1.25rem;animation:pop .18s;outline:0}
.dialog>h2{margin-bottom:.75rem}
.dlg-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.25rem}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;inset-inline:0;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 2rem);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:12px;z-index:90;font-weight:500}

/* admin */
.adm-top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.adm-top-in{display:flex;align-items:center;gap:.75rem 1rem;min-height:60px;flex-wrap:wrap;padding-block:.35rem}
.tabs{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:.45rem .95rem;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface2)}
.tab .n{background:var(--coral);color:#fff;border-radius:99px;font-size:.75rem;padding:0 .5rem;margin-inline-start:.4rem}
.adm-main{padding-block:1.25rem 3rem}
.adm-main h1{font-size:1.4rem;margin-bottom:.25rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-top:1rem}
@media(min-width:800px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border-radius:14px;padding:1rem}
.kpi b{display:block;font-family:var(--f-head);font-size:1.55rem;line-height:1.3}
.kpi span{color:var(--muted);font-size:.9rem}
.kpi.act b{color:var(--coral)}
.panel{background:var(--surface);border-radius:14px;padding:1rem 1.1rem;margin-top:1rem}
.panel>h2{font-size:1.05rem;margin-bottom:.6rem}
.two{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:900px){.two{grid-template-columns:1.3fr 1fr}}
.tool{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center;margin-top:1rem}
.tool .bar{padding:0;flex:1 1 auto}
.tool-r{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.tool-r input[type=search]{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:.4rem .8rem;min-width:230px;outline:0}
.tool-r input[type=search]:focus{border-color:var(--brand)}
.orow{display:grid;grid-template-columns:1fr 1fr;gap:.5rem 1rem;padding:.9rem 0;border-top:1px solid var(--line);align-items:center}
.orow:first-child{border-top:0}
@media(min-width:960px){.orow{grid-template-columns:100px 1.1fr 1.5fr 120px 150px 80px}}
.badge{--c:var(--muted);display:inline-block;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border-radius:99px;padding:0 .75rem;font-size:.85rem;font-weight:600}
.prow{display:grid;grid-template-columns:56px 1fr auto;gap:.5rem 1rem;align-items:center;padding:.75rem 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow.off-p{opacity:.6}
.pthumb{width:56px;height:56px;border-radius:12px;background:hsl(var(--h) var(--ts) var(--tl));display:grid;place-items:center;overflow:hidden}
.pthumb svg{width:82%;height:82%}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pact{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.low{color:var(--coral);font-weight:600}
.chk{display:inline-flex;align-items:center;gap:.4rem;font-size:.9rem;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--btn)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:.4rem 1.25rem;margin:.5rem 0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.imgs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
.im{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--surface2)}
.im img{width:100%;height:100%;object-fit:cover}
.im button{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border:0;border-radius:50%;background:var(--ink);color:var(--bg);cursor:pointer;line-height:1}
.fees{max-height:420px;overflow:auto;margin-top:.5rem}
.fee-r{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:.5rem;padding:.25rem 0;align-items:center}
.fee-r input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:.3rem .5rem}
.chart{width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .n{fill:var(--ink);font-weight:600}
.chart rect{fill:var(--btn)}
.rank{display:grid;gap:.5rem;margin:0;padding:0;list-style:none}
.rank li{display:flex;justify-content:space-between;gap:1rem}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
'use strict';
/* ========== بيانات أساسية ========== */

let S = load();
function load(){
  try{
    const r = localStorage.getItem(KEY);
    if(r){
      const d = JSON.parse(r);
      if(d && Array.isArray(d.products) && d.settings){
        const base = seed();
        d.settings = Object.assign({}, base.settings, d.settings);
        d.settings.fees = Object.assign(defaultFees(), d.settings.fees || {});
        d.orders = d.orders || []; d.seq = d.seq || 1000;
        return d;
      }
    }
  }catch(e){}
  return seed();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast('تعذّر حفظ البيانات في المتصفح. قد تكون المساحة ممتلئة أو التخزين معطّل.'); return false; }
}

/* ========== مزامنة سحابية عبر Google Apps Script (مشتركة بين كل الأجهزة) ========== */
async function pushCloud(type, payload){
  const u = S.settings.webhook; if(!u) return null;
  try{
    const r = await fetch(u, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({type, payload})});
    return await r.json();
  }catch(e){ return null; }
}
async function pullCloud(){
  const u = S.settings.webhook; if(!u) return null;
  try{
    const sep = u.indexOf('?') > -1 ? '&' : '?';
    const r = await fetch(u + sep + 't=' + Date.now());
    return await r.json();
  }catch(e){ return null; }
}
let syncing = false;
async function syncNow(){
  if(syncing) return false;
  if(!S.settings.webhook) return false;
  syncing = true;
  try{
    const data = await pullCloud();
    if(!data || data.ok === false){ return false; }
    if(data.settings == null && data.products == null){
      await pushCloud('settings', S.settings);
      await pushCloud('products', S.products);
      return false;
    }
    let changed = false;
    if(data.settings){
      const base = seed();
      const merged = Object.assign({}, base.settings, data.settings);
      merged.fees = Object.assign(defaultFees(), data.settings.fees || {});
      S.settings = merged; changed = true;
    }
    if(Array.isArray(data.products) && data.products.length){ S.products = data.products; changed = true; }
    if(Array.isArray(data.orders)){ S.orders = data.orders; changed = true; }
    if(changed) save();
    return changed;
  }catch(e){ return false; }
  finally{ syncing = false; }
}

async function saveFile(filename, text){
  try{
    if(window.claude && typeof claude.use === 'function'){
      const d = await claude.use('downloads');
      if(d){ await d.save({filename, data:text}); return true; }
    }
  }catch(e){ if(e && e.code === 'declined') return false; }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:'text/plain;charset=utf-8'}));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    return true;
  }catch(e){ toast('تعذّر تنزيل الملف في هذا العرض.'); return false; }
}

function validateOrder(form){
  const d = Object.fromEntries(new FormData(form)), e = {};
  const ph = toLatin(d.phone).replace(/[\s.\-()]/g, '');
  if(!d.name || d.name.trim().length < 3) e.name = 'اكتب اسمك الكامل.';

  if(d.dtype === 'home' && (!d.address || d.address.trim().length < 4)) e.address = 'اكتب عنوان التوصيل.';
  $$('[data-f]', form).forEach(el => {
    const m = e[el.dataset.f];
    el.classList.toggle('bad', !!m);

async function placeOrder(p, d, ph){
  const qty = V.pv.qty, fee = S.settings.fees[d.wilaya][d.dtype];
  if(p.stock < qty){ toast('الكمية المتوفرة أقل من المطلوب.'); return null; }
  const draft = {
    ts:Date.now(), pid:p.id, pname:p.name, variant:d.variant || '', qty, unit:p.price, fee,
    total:p.price * qty + fee, name:d.name.trim(), phone:ph, wid:+d.wilaya, wilaya:wname(d.wilaya),
    commune:d.commune.trim(), address:d.dtype === 'home' ? d.address.trim() : '', dtype:d.dtype,
    notes:(d.notes || '').trim()
  };
  let id;
  const res = S.settings.webhook ? await pushCloud('order', draft) : null;
  if(res && res.ok && res.id){ id = res.id; }
  else{
    id = 'A-' + (++S.seq);
    if(S.settings.webhook) toast('تعذّر الوصول للخادم، تم حفظ الطلب على هذا الجهاز فقط.');
  }
  const o = Object.assign({id, status:'new'}, draft);
  p.stock -= qty; S.orders.unshift(o); save();
  return o;
}

/* ========== لوحة التحكم: النظرة العامة ========== */
function last7(){
  const days = [];
  for(let i = 6; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate() - i); d.setHours(0,0,0,0);
    days.push(d);
  }
  const sums = days.map(d => {
    const next = +d + 86400000;
    return S.orders.filter(o => o.status !== 'canceled' && o.ts >= +d && o.ts < next).reduce((a, o) => a + o.total, 0);
  });
  return {days, sums};
}
function overviewHTML(){
  const delivered = S.orders.filter(o => o.status === 'delivered');
  const revenue = delivered.reduce((a, o) => a + o.total, 0);
  const active = S.orders.filter(o => !['delivered','canceled','returned'].includes(o.status)).length;
  const low = S.products.filter(p => p.active && p.stock > 0 && p.stock <= 5).length;
  const oos = S.products.filter(p => p.active && p.stock <= 0).length;
  const {days, sums} = last7();
  const max = Math.max(1, ...sums);
  const W = 640, H = 190, bw = W / 7 * 0.55, gap = W / 7;
  const bars = sums.map((v, i) => {
    const h = Math.round(v / max * 130), x = gap * i + (gap - bw) / 2, y = 150 - h;
    return `<rect x="${x.toFixed(1)}" y="${y}" width="${bw.toFixed(1)}" height="${h}" rx="5"/><text class="n" x="${(x + bw/2).toFixed(1)}" y="${y - 6}" text-anchor="middle">${v ? fmt(v) : ''}</text><text x="${(x + bw/2).toFixed(1)}" y="172" text-anchor="middle">${days[i].toLocaleDateString('ar-DZ', {weekday:'short'})}</text>`;
  }).join('');
  const top = [...S.products].sort((a, b) => {
    const sa = S.orders.filter(o => o.pid === a.id && o.status !== 'canceled').reduce((n, o) => n + o.qty, 0);
    const sb = S.orders.filter(o => o.pid === b.id && o.status !== 'canceled').reduce((n, o) => n + o.qty, 0);
    return sb - sa;
  }).slice(0, 5).map(p => {
    const n = S.orders.filter(o => o.pid === p.id && o.status !== 'canceled').reduce((s, o) => s + o.qty, 0);
    return `<li><span>${esc(p.name)}</span><b>${n} قطعة</b></li>`;
  }).join('') || '<li class="muted">لا توجد مبيعات بعد</li>';
  return `<h1>نظرة عامة</h1><p class="muted">ملخص أداء المتجر</p>
    <div class="kpis">
      <div class="kpi"><b>${money(revenue)}</b><span>إجمالي المبيعات المسلَّمة</span></div>
      <div class="kpi act"><b>${active}</b><span>طلبات نشطة</span></div>
      <div class="kpi"><b>${S.products.filter(p=>p.active).length}</b><span>منتجات معروضة</span></div>
      <div class="kpi"><b>${low + oos}</b><span>مخزون منخفض أو نافد</span></div>
    </div>
    <div class="two">
      <div class="panel"><h2>المبيعات خلال 7 أيام</h2><svg class="chart" viewBox="0 0 ${W} ${H}">${bars}</svg></div>
      <div class="panel"><h2>الأكثر مبيعًا</h2><ul class="rank">${top}</ul></div>
    </div>`;
}

function exportOrdersCsv(){
  const head = ['رقم الطلب','التاريخ','الاسم','الهاتف','الولاية','البلدية','العنوان','طريقة التوصيل','المنتج','الخيار','الكمية','سعر التوصيل','الإجمالي','الحالة'];
  const rows = S.orders.map(o => [o.id, dt(o.ts), o.name, o.phone, o.wilaya, o.commune, o.address, o.dtype === 'home' ? 'منزل' : 'مكتب', o.pname, o.variant, o.qty, o.fee, o.total, STATUS[o.status][0]]);
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  saveFile('orders.csv', csv);
}

async function saveProductForm(){
  const name = $('#pn').value.trim();

  const old = Math.max(0, Math.round(+$('#po').value || 0));
  const stock = Math.max(0, Math.round(+$('#ps').value || 0));
  const colors = $('#pcol').value.split(/[,،]/).map(s => s.trim()).filter(Boolean);
  const features = $('#pf').value.split('\n').map(s => s.trim()).filter(Boolean);
  const cat = $('#pc').value, kind = $('#pk').value, desc = $('#pd').value.trim();
  let p = V.editId ? S.products.find(x => x.id === V.editId) : null;
  if(!p){
    p = {id:'p' + (++S.seq), hue: Math.floor(Math.random() * 360), active:true, featured:false, images:[]};

  Object.assign(p, {name, cat, kind, price, old, stock, colors, features, desc, images:[...V.editImgs]});
  if(!save()) return;
  await pushCloud('products', S.products);
  closeDialog(); renderApp(); toast('تم حفظ المنتج.');

function route(){

  if(h === '#/admin'){ V.oq = ''; renderApp(); return; }

document.addEventListener('submit', async e => {
  if(e.target.id === 'loginForm'){
    e.preventDefault();
    const val = $('#lp').value;
    await syncNow();
    if(val === S.settings.pin){
      authed = true; sessionStorage.setItem('ps_auth', '1'); V.adminTab = 'overview'; renderApp();
    }else{
      $('[data-f="pin"] .err').textContent = 'رمز الدخول غير صحيح.';
      $('[data-f="pin"]').classList.add('bad');
    }
    return;
  }
  if(e.target.id === 'orderForm'){
    e.preventDefault();
    const p = S.products.find(x => x.id === V.pv.pid); if(!p) return;
    const {d, e:errs, ph} = validateOrder(e.target);
    if(Object.keys(errs).length){ $('.f.bad input,.f.bad select', e.target)[0]?.focus(); return; }
    const btn = $('#submitBtn'); btn.disabled = true; btn.textContent = 'جارٍ إرسال الطلب…';
    const o = await placeOrder(p, d, ph);
    btn.disabled = false; btn.textContent = 'اطلب الآن: الدفع عند الاستلام';
    if(!o) return;
    $('#order').innerHTML = `<h1>${esc(p.name)}</h1>` + successHTML(o);
    $('.stickybar')?.remove();
    window.scrollTo({top:$('#order').offsetTop - 70, behavior:'smooth'});
    return;
  }
  if(e.target.id === 'prodForm'){ e.preventDefault(); saveProductForm(); return; }
});

document.addEventListener('input', e => {
  if(e.target.id === 'q'){ V.q = e.target.value; paintGrid(); return; }
  if(e.target.id === 'oq'){ V.oq = e.target.value; renderApp(); setTimeout(() => $('#oq')?.focus(), 0); const el=$('#oq'); if(el){el.focus(); el.setSelectionRange(el.value.length, el.value.length);} return; }
  const form = e.target.closest('#orderForm');
  if(form){
    if(e.target.name === 'wilaya') V.pv.wilaya = e.target.value;
    if(e.target.name === 'dtype') V.pv.dtype = e.target.value;
    if(e.target.name === 'variant') V.pv.variant = e.target.value;
    if(['wilaya','dtype','variant'].includes(e.target.name)){
      const p = S.products.find(x => x.id === V.pv.pid);
      if(p) updateSummary(p);
    }
  }
});

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if(!b){
    if(e.target.classList && e.target.classList.contains('scrim')) closeDialog();
    return;
  }
  const act = b.dataset.act;
  switch(act){
    case 'scroll': $('#' + b.dataset.t)?.scrollIntoView({behavior:'smooth'}); break;
    case 'cat': V.cat = b.dataset.v; V.q = ''; paintGrid(); $('#q').value = ''; break;
    case 'img': {
      const p = S.products.find(x => x.id === V.pv.pid);
      const i = +b.dataset.i;
      $('#stage').innerHTML = `<img src="${p.images[i]}" alt="${esc(p.name)}">`;
      $$('.thumb').forEach(t => t.setAttribute('aria-current', String(t === b)));
      break;
    }
    case 'goform': $('#order')?.scrollIntoView({behavior:'smooth', block:'start'}); $('#f-name')?.focus(); break;
    case 'qty': {
      const d = +b.dataset.d, max = +(b.dataset.max || $$('.qty button[data-d="1"]')[0]?.dataset.max || 10);
      V.pv.qty = Math.min(max, Math.max(1, V.pv.qty + d));
      const p = S.products.find(x => x.id === V.pv.pid); if(p) updateSummary(p);
      break;
    }
    case 'closeDialog': closeDialog(); break;
    case 'closeScrim': if(e.target.classList.contains('scrim')) closeDialog(); break;
    case 'confirmYes': { const fn = pendingConfirm; closeDialog(); if(fn) fn(); break; }
    case 'logout': authed = false; sessionStorage.removeItem('ps_auth'); location.hash = '#/'; break;
    case 'atab': {
      V.adminTab = b.dataset.v; V.oq = ''; renderApp();
      const changed = await syncNow(); if(changed) renderApp();
      break;
    }
    case 'ofilter': V.ofilter = b.dataset.v; renderApp(); break;
    case 'exportCsv': exportOrdersCsv(); break;
    case 'refreshOrders': { toast('جارٍ التحديث…'); const changed = await syncNow(); renderApp(); toast(changed ? 'تم التحديث.' : 'لا توجد تغييرات جديدة.'); break; }
    case 'viewOrder': orderDetailDlg(b.dataset.id); break;
    case 'setStatus': {
      const o = S.orders.find(x => x.id === b.dataset.id);
      if(o){ o.status = b.dataset.s; save(); pushCloud('orderStatus', {id:o.id, status:o.status}); renderApp(); toast('تم تحديث حالة الطلب.'); }
      break;
    }
    case 'applyStatus': {
      const o = S.orders.find(x => x.id === b.dataset.id), sel = $('#stSel');
      if(o && sel){ o.status = sel.value; save(); pushCloud('orderStatus', {id:o.id, status:o.status}); closeDialog(); renderApp(); toast('تم تحديث حالة الطلب.'); }
      break;
    }
    case 'delOrder': confirmDlg('حذف الطلب', 'سيتم حذف هذا الطلب نهائيًا من كل الأجهزة. هل تريد المتابعة؟', 'حذف', () => {
      const id = b.dataset.id;
      S.orders = S.orders.filter(x => x.id !== id); save(); pushCloud('deleteOrder', {id}); renderApp(); toast('تم حذف الطلب.');
    }); break;
    case 'newProduct': productDlg(null); break;
    case 'editProduct': productDlg(b.dataset.id); break;
    case 'toggleActive': { const p = S.products.find(x => x.id === b.dataset.id); if(p){ p.active = !p.active; save(); pushCloud('products', S.products); renderApp(); } break; }
    case 'delProduct': confirmDlg('حذف المنتج', 'سيتم حذف هذا المنتج نهائيًا من كل الأجهزة.', 'حذف', () => {
      S.products = S.products.filter(x => x.id !== b.dataset.id); save(); pushCloud('products', S.products); renderApp(); toast('تم حذف المنتج.');
    }); break;
    case 'rmImg': V.editImgs.splice(+b.dataset.i, 1); paintImgs(); break;
    case 'rmCat': {
      const cat = S.settings.cats[+b.dataset.i];
      if(S.products.some(p => p.cat === cat)){ toast('لا يمكن حذف تصنيف يحتوي على منتجات.'); break; }
      S.settings.cats.splice(+b.dataset.i, 1); save(); pushCloud('settings', S.settings); renderApp(); break;
    }
    case 'addCat': {
      const inp = $('#newCat'), v = inp.value.trim();
      if(v && !S.settings.cats.includes(v)){ S.settings.cats.push(v); save(); pushCloud('settings', S.settings); renderApp(); }
      break;
    }
    case 'saveSettings': {
      Object.assign(S.settings, {
        name: $('#sName').value.trim() || S.settings.name,
        nameLatin: $('#sNameL').value.trim(),
        currency: $('#sCur').value.trim() || S.settings.currency,
        phone: $('#sPhone').value.trim(), whatsapp: $('#sWa').value.trim(),
        cc: $('#sCc').value.trim(), pin: $('#sPin').value.trim() || S.settings.pin,
        webhook: $('#sHook').value.trim()
      });
      save();
      const r = await pushCloud('settings', S.settings);
      toast(r && r.ok ? 'تم حفظ الإعدادات وتحديثها على كل الأجهزة.' : 'تم الحفظ محليًا، لكن تعذّر رفعها للخادم.');
      renderApp();
      break;
    }
    case 'saveFees': {
      $$('.fee-r input').forEach(inp => {
        const id = inp.dataset.fee, t = inp.dataset.t;
        S.settings.fees[id][t] = Math.max(0, Math.round(+inp.value || 0));
      });
      save();
      const r = await pushCloud('settings', S.settings);
      toast(r && r.ok ? 'تم حفظ أسعار التوصيل على كل الأجهزة.' : 'تم الحفظ محليًا، لكن تعذّر رفعها للخادم.');
      break;
    }
    case 'exportBackup': saveFile('نسخة-احتياطية.json', JSON.stringify(S, null, 2)); break;
    case 'resetAll': confirmDlg('إعادة ضبط المتجر', 'سيتم حذف جميع المنتجات والطلبات والإعدادات المخصصة نهائيًا واستعادة البيانات الافتراضية.', 'إعادة الضبط', () => {
      S = seed(); save(); renderApp(); toast('تمت إعادة ضبط المتجر.');
    }); break;
  }
});

document.addEventListener('change', async e => {
  if(e.target.id === 'pimg'){
    const files = Array.from(e.target.files || []).slice(0, 6 - V.editImgs.length);
    for(const f of files){
      try{ V.editImgs.push(await readImageFile(f)); }catch(err){}
    }
    e.target.value = ''; paintImgs();
  }
  if(e.target.id === 'restoreFile'){
    const f = e.target.files[0]; if(!f) return;
    try{
      const text = await f.text(); const data = JSON.parse(text);
      if(!data || !Array.isArray(data.products) || !data.settings) throw new Error('bad');
      confirmDlg('استيراد نسخة', 'سيتم استبدال بيانات المتجر الحالية بمحتوى هذا الملف.', 'استيراد', () => {
        S = data; S.settings.fees = Object.assign(defaultFees(), S.settings.fees || {});
        S.orders = S.orders || []; S.seq = S.seq || 1000; save(); renderApp(); toast('تم استيراد النسخة.');
      });
    }catch(err){ toast('ملف غير صالح.'); }
    e.target.value = '';
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && modalRoot.innerHTML) closeDialog();
});

/* ========== الإقلاع ========== */
route();
syncNow().then(changed => { if(changed) route(); });
</script>
</body>
</html>
